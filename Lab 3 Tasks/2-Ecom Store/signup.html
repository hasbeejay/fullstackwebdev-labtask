
<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Create account · hasbeejay's Marketplace</title>

    <link rel="stylesheet" href="bootstrap.min.css">
    <link rel="stylesheet" href="tailwind.css">
    <link rel="stylesheet" href="style.css">
</head>

<body class="d-flex flex-column min-vh-100">

    <nav class="navbar navbar-expand-lg bg-white sticky-top tw-shadow-sm py-3">
        <div class="container">
            <a class="navbar-brand fw-bold fs-3 brand" href="index.html">
                ✦ hasbeejay's Marketplace
            </a>

            <input type="checkbox" id="nav-toggle" class="nav-check">
            <label class="navbar-toggler" for="nav-toggle">
                <span class="navbar-toggler-icon"></span>
            </label>

            <div class="navbar-collapse nav-menu">
                <ul class="navbar-nav mx-auto gap-lg-3">
                    <li class="nav-item">
                        <a class="btn btn-light tw-rounded-full px-4 fw-semibold" href="index.html">
                            Home
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="btn btn-light tw-rounded-full px-4 fw-semibold" href="index.html#shop">
                            Shop
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="btn btn-light tw-rounded-full px-4 fw-semibold" href="index.html#reviews">
                            Reviews
                        </a>
                    </li>
                </ul>

                <div class="d-flex align-items-center gap-2 mt-3 mt-lg-0">
                    <a class="btn btn-light position-relative tw-rounded-full" href="cart.html">
                        🛒 Cart
                        <span class="badge bg-danger rounded-pill">4</span>
                    </a>

                    <a class="btn btn-outline-dark tw-rounded-full" href="login.html">
                        Login
                    </a>

                    <a class="btn btn-primary btn-grad tw-rounded-full" href="signup.html">
                        Sign up
                    </a>
                </div>
            </div>
        </div>
    </nav>

    <div class="container py-5 flex-grow-1">
        <div class="row justify-content-center">
            <div class="col-md-6 col-lg-5">
                <div class="card border-0 tw-rounded-3xl tw-shadow-xl p-4 p-md-5">
                    <h2 class="fw-bold">Create account</h2>

                    <p class="text-muted mb-4">
                        Join Luma in seconds
                    </p>

                    <form action="login.html">
                        <div class="mb-3">
                            <label class="form-label fw-semibold">
                                Full name
                            </label>

                            <input
                                type="text"
                                class="form-control form-control-lg tw-rounded-xl"
                                placeholder="Jane Doe"
                                required
                            >
                        </div>

                        <div class="mb-3">
                            <label class="form-label fw-semibold">
                                Email
                            </label>

                            <input
                                type="email"
                                class="form-control form-control-lg tw-rounded-xl"
                                placeholder="you@example.com"
                                required
                            >
                        </div>

                        <div class="mb-3">
                            <label class="form-label fw-semibold">
                                Password
                            </label>

                            <input
                                type="password"
                                class="form-control form-control-lg tw-rounded-xl"
                                placeholder="At least 8 characters"
                                required
                            >
                        </div>

                        <button class="btn btn-primary btn-grad btn-lg w-100 tw-rounded-full mt-2">
                            Sign up
                        </button>
                    </form>

                    <p class="text-center text-muted mt-4 mb-0">
                        Already registered?
                        <a href="login.html">Log in</a>
                    </p>
                </div>
            </div>
        </div>
    </div>

    <footer class="text-center text-muted py-4 mt-auto border-top bg-white">
        © 2026 hasbeejay's Marketplace · Crafted with Bootstrap &amp; Tailwind · No JavaScript
    </footer>

</body>

</html>
